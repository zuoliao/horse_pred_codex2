[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "horse-pred"
version = "0.1.0"
description = "Point-in-time JRA horse-racing prediction baselines"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "lightgbm>=4.3,<5",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.5,<1.7",
]

[project.scripts]
horse-pred = "horse_pred.cli:main"

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/horse_pred"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
